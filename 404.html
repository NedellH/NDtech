<!DOCTYPE html>

<head>

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;background:#faf9f5;color:#0f172a;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:32px;position:relative;overflow-x:hidden}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(13,148,136,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(13,148,136,.05) 1px,transparent 1px);background-size:44px 44px}
  main{position:relative;max-width:560px}
  .code{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#0d9488}
  h1{margin:18px 0 14px;font-size:clamp(32px,7vw,46px);line-height:1.08;letter-spacing:-.03em;font-weight:600}
  p{font-size:16px;line-height:1.6;color:#475569}
  .row{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
  a.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border-radius:999px;padding:13px 22px;font-size:14.5px;font-weight:600;
        transition:background .25s ease,border-color .25s ease,transform .25s ease}
  a.solid{background:#0d9488;color:#fff}
  a.solid:hover{background:#0f766e;transform:translateY(-2px)}
  a.ghost{border:1px solid rgba(15,23,42,.16);color:#0f172a}
  a.ghost:hover{border-color:#0d9488;background:rgba(13,148,136,.05);transform:translateY(-2px)}
  footer{margin-top:40px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#94a3b8}
  @media (prefers-reduced-motion:reduce){a.btn{transition:none}a.btn:hover{transform:none}}
</style>
</head>
<body>
<div class="grid"></div>
<main>
  <div class="code">404 / pagina niet gevonden</div>
  <h1>Deze pagina is er niet.</h1>
  <p>Mogelijk is de link verouderd of staat er een typefout in. Ga terug naar de homepage, of vertel meteen waar bij u de tijd verloren gaat.</p>
  <div class="row">
    <a class="solid" href="/">Naar de homepage</a>
    <a class="ghost" href="/intake">Doe de intake</a>
  </div>
  <footer>NHE tech · Schiedam · handelend onder NDTechAI</footer>
</main>
</body>
