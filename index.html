document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 het scherm waar uw team het ziet.\",\"d1t\":\"Procesautomatisering\",\"d1p\":\"Mailboxen, formulieren en spreadsheets die zichzelf verwerken. Wat nu drie keer wordt overgetypt, gebeurt één keer.\",\"d2t\":\"AI voor documenten\",\"d2p\":\"Facturen, offertes, bonnen en contracten uitlezen, controleren en wegschrijven. Twijfelt het model, dan gaat het naar een mens.\",\"d3t\":\"Systeemkoppelingen\",\"d3p\":\"Uw boekhouding, CRM, mail en agenda aan elkaar. Is er een API, dan praat ik ermee. Zo niet, dan verzin ik een weg.\",\"d4t\":\"Webapps en portalen\",\"d4p\":\"Een klantportaal, een planbord of een intern schermpje dat precies doet wat uw team nodig heeft. Niets meer, niets minder.\",\"d5t\":\"Data en rapportage\",\"d5p\":\"Van zeven losse Excels naar één cijfer waar iedereen op vertrouwt. Inclusief de saaie vraag: klopt het eigenlijk wel?\",\"d6t\":\"IT die gewoon werkt\",\"d6p\":\"Werkplekken, e-mail, back-up en beveiliging. De basis op orde, zodat de rest überhaupt kan draaien.\",\"lbl2\":\"02 / Hoe het werkt\",\"h2Werkwijze\":\"In vier stappen van chaos naar rust.\",\"step1\":\"Een uur meekijken\",\"step1p\":\"Ik kom langs of bel in en kijk mee met wie het werk doet. Niet met een vragenlijst, gewoon zien waar getikt, gezocht en gezucht wordt. Kost u een uur en het is gratis.\",\"step2\":\"Blauwdruk met prijskaartje\",\"step2p\":\"U krijgt op één A4 wat er gebouwd wordt, in welke fases, en wat elke fase kost. Vaste prijs. \",\"step3\":\"Bouwen in kleine fases\",\"step3p\":\"Ik knip het werk op in stukken van twee weken. Elk stuk draait daarna echt mee op de werkvloer, dus u ziet resultaat voordat u de rest betaalt. Na elk stuk beslist u zelf of we doorgaan.\",\"step4\":\"Meekijken en bijstellen\",\"step4p\":\"De eerste weken houd ik alles in de gaten. Daarna kunt u het zelf beheren of een klein abonnement nemen. Geen gouden kooi: de code en koppelingen zijn van u.\",\"lbl3\":\"03 / Voorbeeld\",\"h2Voorbeeld\":\"Van vijf handelingen naar één blik.\",\"pVoorbeeld\":\"Bij de meeste MKB-bedrijven komt het werk binnen als mail: een aanvraag, een order, een factuur, een vraag van een klant. Iemand leest het, zoekt het na en typt het ergens anders opnieuw in. Zo ziet dat eruit voor en na.\",\"voorLbl\":\"Voor\",\"voorT\":\"Vijf handelingen per bericht\",\"v1\":\"Mail openen en doorlezen\",\"v2\":\"Klantgegevens opzoeken in een ander systeem\",\"v3\":\"Gegevens overtypen in de administratie\",\"v4\":\"Collega apart informeren\",\"v5\":\"Later uitzoeken wat er is misgegaan\",\"naLbl\":\"Na\",\"naT\":\"Uw team kijkt alleen nog mee\",\"a1\":\"Bericht komt binnen en wordt automatisch uitgelezen\",\"a2\":\"Klant en contactpersoon worden opgezocht en gekoppeld\",\"a3\":\"Het staat direct goed in uw eigen systeem\",\"a4\":\"Eén melding: klaar, of even kijken\",\"a5\":\"Twijfelgevallen blijven leeg in plaats van fout\",\"lbl4\":\"04 / Over mij\",\"overP1\":\"Ik werk vanuit Schiedam voor MKB-bedrijven in heel Nederland. Mijn achtergrond is breed IT: netwerken en werkplekken, daarna software, en nu vooral het stukje ertussenin. Systemen laten samenwerken en AI inzetten waar het écht tijd scheelt.\",\"overP2\":\"Wat ik anders doe: ik begin bij het werk, niet bij de software. Vaak blijkt de helft van een probleem op te lossen zonder ook maar één nieuw abonnement. Dat zeg ik dan ook, ook al verdien ik er niets aan.\",\"tag2\":\"Node en React\",\"tag3\":\"LLM-integraties\",\"tag4\":\"API-koppelingen\",\"tag5\":\"Werkplekbeheer\",\"tag6\":\"Automatisering\",\"lbl5\":\"05 / Veelgestelde vragen\",\"h2Faq\":\"Waar u vast over twijfelt.\",\"q1\":\"Wat gaat dit kosten?\",\"q1a\":\"Per fase een vaste prijs, geen nacalculatie. Een eerste fase ligt bij de meeste MKB-trajecten tussen € 750 en € 2.500. U krijgt dat bedrag vooraf op papier en betaalt in twee termijnen: bij akkoord en bij oplevering.\",\"q2\":\"Moeten wij dan overstappen op andere software?\",\"q2a\":\"Nee. Het uitgangspunt is dat uw team blijft werken in wat het kent. Ik bouw eromheen en ertussen. Pas als een pakket écht in de weg zit, zeg ik dat, met een reden en niet met een verkooppraatje.\",\"q3\":\"Wat als de AI iets fout leest?\",\"q3a\":\"Dan doet het systeem niets. Bij twijfel blijft een veld leeg en krijgt uw team een melding om het aan te vullen. Liever een leeg veld dan een verkeerd bedrag. Alles wordt gelogd, dus u kunt altijd terugkijken wat er gebeurd is.\",\"q4\":\"Waar staat onze data?\",\"q4a\":\"Binnen de EU, en waar het kan in uw eigen omgeving. Uw gegevens worden niet gebruikt om modellen te trainen. We tekenen een verwerkersovereenkomst voordat er ook maar één mail wordt uitgelezen.\",\"q5\":\"En als u er over een jaar mee stopt?\",\"q5a\":\"Dan houdt u alles. De code, de koppelingen en de documentatie staan op uw naam, in uw eigen omgeving. Beheer bij mij is een keuze, geen slot op de deur.\",\"lbl6\":\"06 / Contact\",\"h2Contact\":\"Waar gaat bij u de meeste tijd verloren?\",\"pContact\":\"Twee zinnen zijn genoeg. Binnen één werkdag hoort u wat er mogelijk is, wat het ongeveer kost, of dat u hier niemand voor nodig heeft.\",\"plaats\":\"Schiedam · werkgebied heel Nederland\",\"kvk\":\"KvK 42125754\",\"lblNaam\":\"Naam\",\"lblBedrijf\":\"Bedrijf\",\"lblMail\":\"E-mail\",\"lblVraag\":\"Wat doet u nu nog met de hand?\",\"hint\":\"Geen nieuwsbrief, geen verkoopmail. Alleen een antwoord.\",\"sentMsg\":\"Dank, uw bericht staat klaar. Ik reageer binnen één werkdag.\",\"footer\":\"© 2026 NHE tech · handelend onder NDTechAI\",\"phName\":\"Uw naam\",\"phCompany\":\"Bedrijfsnaam\",\"phEmail\":\"naam@bedrijf.nl\",\"phMsg\":\"Bijvoorbeeld: elke order wordt bij ons drie keer overgetypt.\",\"send\":\"Stuur mijn vraag\",\"sent\":\"Verzonden ✓\"},\"en\":{\"homeTitle\":\"Back to top\",\"navIntake\":\"Intake\",\"intake\":\"Rather answer three short questions first?\",\"navDiensten\":\"Services\",\"navWerkwijze\":\"Process\",\"navVoorbeeld\":\"Example\",\"navContact\":\"Contact\",\"navCta\":\"Book a call\",\"heroBadge\":\"Available for new projects\",\"heroH1\":\"The retyping can stop.\",\"heroP\":\"I build software that takes the dull work out of your business: reading mail and documents, checking data, connecting systems. Not a six-month programme, but something that runs in two weeks.\",\"heroCta1\":\"Tell me what goes wrong\",\"heroCta2\":\"How I work\",\"flowTitle\":\"How a flow works\",\"flowStatus\":\"running · 24/7\",\"n1\":\"Message in\",\"n1s\":\"trigger · mailbox\",\"n2\":\"AI agent\",\"n2s\":\"reads and enriches\",\"f1\":\"customer\",\"f2\":\"contact\",\"f3\":\"reference\",\"n3\":\"Complete?\",\"n3y\":\"yes\",\"n3n\":\"no, to a human\",\"n4\":\"Recorded\",\"n4s\":\"in your own system\",\"n5\":\"Team notified\",\"n5s\":\"one message\",\"lbl1\":\"01 / What I do\",\"h2Diensten\":\"Broad enough to solve the whole problem.\",\"pDiensten\":\"Most agencies do one piece. I take the whole chain: from where the work arrives to the screen where your team sees it.\",\"d1t\":\"Process automation\",\"d1p\":\"Mailboxes, forms and spreadsheets that process themselves. What is now retyped three times happens once.\",\"d2t\":\"AI for documents\",\"d2p\":\"Reading, checking and filing invoices, quotes, receipts and contracts. If the model is unsure, it goes to a human.\",\"d3t\":\"System integrations\",\"d3p\":\"Your accounting, CRM, mail and calendar connected. If there is an API, I speak to it. If not, I find a way.\",\"d4t\":\"Web apps and portals\",\"d4p\":\"A customer portal, a planning board or an internal screen that does exactly what your team needs. Nothing more, nothing less.\",\"d5t\":\"Data and reporting\",\"d5p\":\"From seven separate spreadsheets to one number everyone trusts. Including the boring question: is it actually correct?\",\"d6t\":\"IT that simply works\",\"d6p\":\"Workstations, mail, backup and security. The basics in order, so the rest can run at all.\",\"lbl2\":\"02 / How it works\",\"h2Werkwijze\":\"From chaos to calm in four steps.\",\"step1\":\"An hour of watching\",\"step1p\":\"I visit or dial in and watch the people doing the work. No questionnaire, just seeing where things are typed, searched and sighed over. Costs you an hour and is free.\",\"step2\":\"Blueprint with a price\",\"step2p\":\"You get one page stating what gets built, in which phases, and what each phase costs. Fixed price. If it takes longer than I thought, that is my problem.\",\"step3\":\"Building in small phases\",\"step3p\":\"I cut the work into two-week pieces. Each piece then runs for real on the work floor, so you see results before paying the rest. After every piece you decide whether we continue.\",\"step4\":\"Monitoring and tuning\",\"step4p\":\"I keep an eye on everything for the first weeks. After that you can manage it yourself or take a small support plan. No golden cage: the code and integrations are yours.\",\"lbl3\":\"03 / Example\",\"h2Voorbeeld\":\"From five actions to one glance.\",\"pVoorbeeld\":\"In most small and mid-sized companies the work arrives as mail: a request, an order, an invoice, a customer question. Someone reads it, looks it up and types it in again somewhere else. Here is what that looks like before and after.\",\"voorLbl\":\"Before\",\"voorT\":\"Five actions per message\",\"v1\":\"Open the mail and read it\",\"v2\":\"Look up customer details in another system\",\"v3\":\"Retype the data into the admin system\",\"v4\":\"Inform a colleague separately\",\"v5\":\"Work out later what went wrong\",\"naLbl\":\"After\",\"naT\":\"Your team only checks\",\"a1\":\"The message arrives and is read automatically\",\"a2\":\"Customer and contact are found and linked\",\"a3\":\"It lands correctly in your own system right away\",\"a4\":\"One message: done, or please check\",\"a5\":\"Uncertain cases stay empty instead of wrong\",\"lbl4\":\"04 / About me\",\"overP1\":\"I work from Schiedam for small and mid-sized companies across the Netherlands. My background is broad IT: networks and workstations, then software, and now mostly the part in between. Making systems work together and using AI where it genuinely saves time.\",\"overP2\":\"What I do differently: I start with the work, not the software. Often half a problem can be solved without a single new subscription. I will say so, even though I earn nothing from it.\",\"tag2\":\"Node and React\",\"tag3\":\"LLM integrations\",\"tag4\":\"API integrations\",\"tag5\":\"Workplace management\",\"tag6\":\"Automation\",\"lbl5\":\"05 / Frequently asked\",\"h2Faq\":\"What you are probably wondering.\",\"q1\":\"What will this cost?\",\"q1a\":\"A fixed price per phase, no after-the-fact billing. A first phase is usually between € 750 and € 2,500. You get that amount in writing up front and pay in two instalments: on approval and on delivery.\",\"q2\":\"Do we have to switch software?\",\"q2a\":\"No. The starting point is that your team keeps working in what it knows. I build around and between it. Only if a package really gets in the way will I say so, with a reason and not a sales pitch.\",\"q3\":\"What if the AI reads something wrong?\",\"q3a\":\"Then the system does nothing. When in doubt a field stays empty and your team gets a note to complete it. An empty field beats a wrong amount. Everything is logged, so you can always see what happened.\",\"q4\":\"Where is our data stored?\",\"q4a\":\"Within the EU, and in your own environment where possible. Your data is not used to train models. We sign a data processing agreement before a single mail is read.\",\"q5\":\"And if you stop in a year?\",\"q5a\":\"Then you keep everything. The code, the integrations and the documentation are in your name, in your own environment. Support from me is a choice, not a lock on the door.\",\"lbl6\":\"06 / Contact\",\"h2Contact\":\"Where does your time disappear?\",\"pContact\":\"Two sentences will do. Within one working day you will hear what is possible, roughly what it costs, or that you do not need anyone for this.\",\"plaats\":\"Schiedam · working across the Netherlands\",\"kvk\":\"Company reg. 42125754\",\"lblNaam\":\"Name\",\"lblBedrijf\":\"Company\",\"lblMail\":\"Email\",\"lblVraag\":\"What do you still do by hand?\",\"hint\":\"No newsletter, no sales mail. Just an answer.\",\"sentMsg\":\"Thank you, your message is ready. I reply within one working day.\",\"footer\":\"© 2026 NHE tech · trading as NDTechAI\",\"phName\":\"Your name\",\"phCompany\":\"Company name\",\"phEmail\":\"name@company.com\",\"phMsg\":\"For example: every order gets retyped three times here.\",\"send\":\"Send my question\",\"sent\":\"Sent ✓\"}};\n\n  setHead() {\n    var nl = this.state.lang !== \"en\";\n    var title = nl ? \"NHE tech \\u2014 automatisering en AI voor het MKB\" : \"NHE tech \\u2014 automation and AI for small business\";\n    var desc = nl\n      ? \"Nedell Hansen bouwt software die het handwerk uit uw bedrijf haalt: mail en documenten uitlezen, gegevens controleren, systemen koppelen. Vaste prijs per fase, eerste resultaat in twee weken.\"\n      : \"Nedell Hansen builds software that takes the manual work out of your business: reading mail and documents, checking data, connecting systems. Fixed price per phase, first results in two weeks.\";\n    document.title = title;\n    document.documentElement.lang = nl ? \"nl\" : \"en\";\n    var set = function (sel, attr, key, val) {\n      var m = document.head.querySelector(sel);\n      if (!m) { m = document.createElement(\"meta\"); m.setAttribute(attr, key); document.head.appendChild(m); }\n      m.setAttribute(\"content\", val);\n    };\n    set('meta[name=\"description\"]', \"name\", \"description\", desc);\n    set('meta[property=\"og:title\"]', \"property\", \"og:title\", title);\n    set('meta[property=\"og:description\"]', \"property\", \"og:description\", desc);\n    set('meta[property=\"og:type\"]', \"property\", \"og:type\", \"website\");\n    set('meta[name=\"theme-color\"]', \"name\", \"theme-color\", \"#0d9488\");\n  }\n\n  placePhoto() {\n    var img = document.getElementById(\"a-photo\");\n    if (!img) return;\n    var x = this.props.photoX != null ? this.props.photoX : 56;\n    var y = this.props.photoY != null ? this.props.photoY : 26;\n    var z = this.props.photoZoom != null ? this.props.photoZoom : 100;\n    img.style.objectPosition = x + \"% \" + y + \"%\";\n    img.style.transform = z === 100 ? \"none\" : \"scale(\" + (z / 100) + \")\";\n  }\n\n  afterRender() {\n    if (this._queued) return;\n    this._queued = true;\n    var self = this;\n    setTimeout(function () {\n      self._queued = false;\n      self.placePhoto();\n      self.setHead();\n      if (self.motion) self.motion();\n    }, 0);\n  }\n\n  showToTop(on) {\n    var b = document.getElementById(\"a-totop\");\n    if (!b) return;\n    b.style.opacity = on ? \"1\" : \"0\";\n    b.style.transform = on ? \"translateY(0)\" : \"translateY(14px)\";\n    b.style.pointerEvents = on ? \"auto\" : \"none\";\n  }\n\n  componentDidMount() {\n    this.placePhoto();\n    this.setHead();\n\n    // back-to-top: after scrolling down, and right after an in-page jump\n    this._top = () => this.showToTop(window.scrollY > 420);\n    window.addEventListener(\"scroll\", this._top, { passive: true });\n    this._top();\n    this._jump = (e) => {\n      var a = e.target.closest ? e.target.closest('a[href^=\"#\"]') : null;\n      if (a) setTimeout(() => this.showToTop(true), 60);\n    };\n    document.addEventListener(\"click\", this._jump);\n\n    // nav: hide on scroll down, reveal on scroll up + active-section highlight\n    const nav = document.getElementById(\"a-nav\");\n    const links = Array.prototype.slice.call(document.querySelectorAll(\"[data-navlink]\"));\n    let last = window.scrollY;\n    this._nav = () => {\n      const y = window.scrollY;\n      if (nav) nav.style.transform = (y > 220 && y > last) ? \"translateY(-105%)\" : \"translateY(0)\";\n      last = y;\n      links.forEach((a) => {\n        const sec = document.getElementById(a.dataset.navlink);\n        if (!sec) return;\n        const r = sec.getBo
